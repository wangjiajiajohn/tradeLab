name: TradeLabV2
options:
  bundleIdPrefix: com.tradelab
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4JLZPF9655
targets:
  TradeLabV2:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: TradeLab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tradelab.backtest.v2
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  TradeLabV2Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TradeLabV2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tradelab.backtest.v2.tests
schemes:
  TradeLabV2:
    build:
      targets:
        TradeLabV2: all
        TradeLabV2Tests: [test]
    test:
      targets:
        - TradeLabV2Tests
